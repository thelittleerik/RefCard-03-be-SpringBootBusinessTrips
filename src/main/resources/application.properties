management.endpoint.health.show-details=always

# Hibernate gibt beim Start die JDBC-URL aus, und der MariaDB-Treiber hängt dort Benutzer und Passwort an.
# Ohne diese Zeile stünde das Datenbank-Passwort im Klartext im Log (auf AWS: in CloudWatch).
logging.level.org.hibernate.orm.connections.pooling=WARN

# /actuator/info zeigt, welche Version läuft. Die Pipeline setzt beide Werte beim Image-Build
# und prüft nach dem Deployment, ob ECS tatsächlich diese Version ausliefert.
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.version=${APP_VERSION:dev}
info.app.commit=${APP_COMMIT:unknown}

# Bild-Storage (RefCard 04/05): "local" = Dateisystem/Volume, "s3" = S3-Bucket (siehe application-aws.properties)
app.storage.type=${STORAGE_TYPE:local}
app.storage.location=${APP_STORAGE_LOCATION:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
