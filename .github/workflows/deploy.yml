name: CI/CD Backend

# main          -> Image sha-<commit> + main, Deployment auf ECS
# Tag vX.Y.Z    -> Image X.Y.Z + X.Y + latest, Deployment auf ECS
# Pull Request  -> nur Test und Build
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: biztrips-backend
  ECS_CLUSTER: biztrips-cluster
  ECS_SERVICE: biztrips-backend-service
  CONTAINER_NAME: biztrips-backend
  ALB_NAME: biztrips-alb

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 einrichten
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Tests ausführen
        run: ./mvnw -B test

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 einrichten
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Jar bauen
        run: ./mvnw -B clean package -DskipTests

      - name: Jar als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  image:
    name: Image → ECR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version bestimmen
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Ungültiger Release-Tag::'$GITHUB_REF_NAME' ist keine SemVer-Version. Erwartet wird vMAJOR.MINOR.PATCH, z. B. v1.2.0."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error title=Release-Tag ausserhalb von main::Der Tag $GITHUB_REF_NAME zeigt auf einen Commit, der nicht in main enthalten ist. Releases werden nur von main erstellt."
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="sha-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Bei AWS anmelden (Learner Lab)
        uses: ./.github/actions/aws-learner-lab-login
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bei ECR anmelden
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image-Tags ableiten
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v4

      - name: Image bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Zusammenfassung
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image in ECR"
            echo
            echo "Repository \`$ECR_REPOSITORY\`, Version \`${{ steps.version.outputs.version }}\`"
            echo
            echo '```'
            while read -r tag; do echo "${tag##*/}"; done <<<"$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy → ECS
    runs-on: ubuntu-latest
    needs: image
    # Deployments nie parallel und nie abbrechen: ein halb ausgerolltes Deployment wäre schlimmer als Warten.
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    outputs:
      url: ${{ steps.alb.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - name: Bei AWS anmelden (Learner Lab)
        id: aws
        uses: ./.github/actions/aws-learner-lab-login
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECS-Service vorhanden?
        run: |
          status=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].status' --output text)
          if [[ "$status" != "ACTIVE" ]]; then
            echo "::error title=ECS-Service fehlt::Service '$ECS_SERVICE' im Cluster '$ECS_CLUSTER' ist nicht aktiv (Status: $status). Infrastruktur einmalig mit infra/setup-aws.sh anlegen."
            exit 1
          fi

      - name: Task-Definition mit neuem Image rendern
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.aws.outputs.account-id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ needs.image.outputs.version }}

      - name: ECS-Service deployen (Rolling Deployment)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          desired-count: ${{ vars.ECS_DESIRED_COUNT || 2 }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Adresse des Load Balancers ermitteln
        id: alb
        run: |
          dns=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].DNSName' --output text)
          echo "url=http://$dns" >> "$GITHUB_OUTPUT"

      - name: Diagnose bei fehlgeschlagenem Deployment
        if: failure()
        run: |
          echo "::group::Letzte Service-Events"
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].events[:10].[createdAt,message]' --output text || true
          echo "::endgroup::"
          echo "::group::Zuletzt gestoppte Tasks"
          tasks=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" \
            --desired-status STOPPED --query 'taskArns[:5]' --output text || true)
          if [[ -n "$tasks" && "$tasks" != "None" ]]; then
            read -ra task_arns <<<"$tasks"
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "${task_arns[@]}" \
              --query 'tasks[].[stoppedReason,containers[0].reason,containers[0].exitCode]' --output text || true
          fi
          echo "::endgroup::"
          echo "::error title=Deployment fehlgeschlagen::Der Service '$ECS_SERVICE' wurde nicht stabil. Ursache steht in den Gruppen 'Letzte Service-Events' / 'Zuletzt gestoppte Tasks' und in CloudWatch (/ecs/biztrips-backend)."

  verify:
    name: Smoke-Test
    runs-on: ubuntu-latest
    needs: [image, deploy]
    steps:
      - uses: actions/checkout@v7

      - name: Ausgeliefertes Backend prüfen
        run: ./scripts/smoke-test.sh "${{ needs.deploy.outputs.url }}" "${{ github.sha }}"

      - name: Zusammenfassung
        run: |
          {
            echo "### Deployment verifiziert"
            echo
            echo "- Version: \`${{ needs.image.outputs.version }}\` (Commit \`${GITHUB_SHA::7}\`)"
            echo "- Health: ${{ needs.deploy.outputs.url }}/actuator/health"
            echo "- Geprüft: Health, ausgelieferte Version, Datenbank (RDS), Bild-Storage (S3)"
          } >> "$GITHUB_STEP_SUMMARY"
