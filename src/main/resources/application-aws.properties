# Profil "aws" (SPRING_PROFILES_ACTIVE=aws): RDS-MariaDB + S3.
# Diese Datei enthält bewusst KEINE Zugangsdaten und keine Defaults für Host/User/Passwort:
# fehlt eine der Variablen, startet die Applikation nicht - statt still mit falschen Werten zu laufen.
#
#   DB_HOST, DB_NAME, DB_USERNAME, DB_PASSWORD   -> auf ECS aus AWS Secrets Manager (task-definition.json, "secrets")
#   DB_PORT                                      -> optional, Default 3306
#   S3_BUCKET                                    -> Name des Bild-Buckets
#   AWS_REGION                                   -> auf ECS automatisch gesetzt
#   S3_ENDPOINT, S3_PATH_STYLE_ACCESS            -> nur lokal für MinIO (refcard-05-compose)

spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# db.t3.micro erlaubt nur wenige Verbindungen; zwei Tasks teilen sich die Instanz.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update

app.storage.type=s3
app.storage.s3.bucket=${S3_BUCKET}
app.storage.s3.region=${AWS_REGION:us-east-1}
app.storage.s3.prefix=${S3_PREFIX:employee-photos/}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}

# Der Load Balancer und der Container-Health-Check fragen /actuator/health ab.
# Details (DB-Status) nur für die Betreiber sichtbar machen, nicht für jeden Aufrufer.
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
